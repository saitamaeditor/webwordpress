name: Actualizar Catálogo Automáticamente

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests

      - name: Ejecutar script de actualización
        run: |
          python actualizar_catalogo.py

      - name: Guardar y subir cambios al repositorio
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add catalog.json actualizar_catalogo.log || true
          git commit -m "Actualización automática del catálogo [skip ci]" || echo "No hay cambios que commitear"
          git push
